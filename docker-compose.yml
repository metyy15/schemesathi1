version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: schemesathi
      POSTGRES_PASSWORD: schemesathi
      POSTGRES_DB: schemesathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    depends_on:
      - db
    volumes:
      - ./apps/api:/app
      - ./apps/api/uploads:/app/uploads

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
}
